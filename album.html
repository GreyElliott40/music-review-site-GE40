<!DOCTYPE html>
<!-- album.html — the page for ONE album. Which album? The address tells us:
     album.html?id=b1392450-e666-3926-a536-22c65f834433
     album.js reads that id and asks MusicBrainz for the details. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- album.js replaces this title with the album's name once it loads. -->
  <title>Album — Spin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER and FOOTER: layout.js fills these in, so every page shares one copy. -->
  <header class="site-header" id="site-header"></header>

  <main class="container">

    <!-- album.js changes this link to go back to your search (index.html?q=...). -->
    <a href="index.html" class="back-link" id="back-link">← Back to search</a>

    <!-- "Loading album...", or an error message. -->
    <p class="status-message" id="status-message" aria-live="polite">Loading album...</p>

    <!-- album.js builds the cover, title, artist and year inside this box. -->
    <div id="album-header-area"></div>

    <!-- YOUR REVIEW. "hidden" keeps it invisible until the album has loaded;
         album.js removes "hidden" and fills in any review you saved before. -->
    <section class="review-box" id="review-box" hidden>
      <h2>Your review</h2>

      <div class="rating-row">
        <!-- THE STARS. role="slider" tells screen readers "this is a control you
             change with arrow keys", like a volume slider. tabindex="0" lets you reach
             it with Tab. aria-valuetext is what a screen reader says, e.g.
             "3.5 out of 5 stars"; album.js keeps it up to date.
             data-star="3" is our own label so album.js knows which star you clicked. -->
        <div class="star-rating" id="star-rating" role="slider" tabindex="0"
             aria-label="Your rating" aria-valuemin="0" aria-valuemax="5"
             aria-valuenow="0" aria-valuetext="No rating">
          <span class="star" data-star="1">★</span>
          <span class="star" data-star="2">★</span>
          <span class="star" data-star="3">★</span>
          <span class="star" data-star="4">★</span>
          <span class="star" data-star="5">★</span>
        </div>

        <!-- THE HEART. aria-pressed="true/false" tells screen readers it's an
             on/off button, and whether it's on. -->
        <button type="button" class="like-button" id="like-button" aria-pressed="false">
          <span class="like-icon" aria-hidden="true">♥</span>
          <span class="like-label" id="like-label">Like</span>
        </button>
      </div>

      <!-- "Rate this album", or "3.5 out of 5" once you've picked, plus a short
           "Saved ✓" after a star or heart click (those save right away). -->
      <p class="rating-label">
        <span id="rating-label">Rate this album</span>
        <span class="quick-message" id="quick-message" aria-live="polite"></span>
      </p>

      <label class="review-text-label" for="review-text">Write a review (optional)</label>
      <textarea class="review-text" id="review-text" rows="5"
                placeholder="What did you think?"></textarea>
      <!-- Live character count, e.g. "312 / 1000". -->
      <p class="char-count" id="char-count"></p>

      <div class="review-actions">
        <button type="button" class="button button-primary" id="save-button" disabled>Save review</button>
        <!-- Only shown once a review exists. -->
        <button type="button" class="button button-plain" id="delete-button" hidden>Delete review</button>
        <!-- "Saved ✓", hints, and error messages. -->
        <span class="review-message" id="review-message" aria-live="polite"></span>
      </div>

      <!-- Asks "are you sure?" on the page instead of a browser popup. Hidden until you click Delete. -->
      <div class="delete-confirm" id="delete-confirm" hidden>
        <p>Delete your review of this album? This can't be undone.</p>
        <button type="button" class="button button-danger" id="confirm-delete-button">Yes, delete it</button>
        <button type="button" class="button button-plain" id="cancel-delete-button">Cancel</button>
      </div>

      <!-- "Reviewed Nov 14, 2026" -->
      <p class="reviewed-date" id="reviewed-date"></p>
    </section>

    <!-- album.js builds the tracklist inside this box. -->
    <div id="tracklist-area"></div>

  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- Same idea as index.html: shared helpers first, then this page's own script.
       reviews.js (save/load/delete reviews) must load before album.js uses it. -->
  <script src="layout.js"></script>
  <script src="musicbrainz.js"></script>
  <script src="reviews.js"></script>
  <script src="album.js"></script>

</body>
</html>
